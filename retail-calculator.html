<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Retail Profit Calculator</title>
<style>
  :root {
    --bg: #f7f7f5; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6b66; --border: #e2e2dd;
    --accent: #c2410c; --accent-soft: #fff1e8; --good: #15803d; --bad: #b91c1c; --input: #ffffff;
    --tip-bg: #1d1d1b; --tip-text: #f7f7f5;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #161614; --panel: #1f1f1c; --text: #ecece8; --muted: #9a9a93; --border: #33332f;
      --accent: #fb923c; --accent-soft: #2e1f14; --good: #4ade80; --bad: #f87171; --input: #262623;
      --tip-bg: #ecece8; --tip-text: #161614;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 1180px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 0 0 4px; }
  h2 { font-size: 15px; margin: 0 0 10px; }
  .sub { color: var(--muted); margin: 0 0 20px; font-size: 13px; }
  .panel { background: var(--panel); border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin-bottom: 16px; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 12px 16px; }
  label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); font-weight: 600; }
  .lbl { display: flex; align-items: center; gap: 5px; }
  input, select { font: inherit; color: var(--text); background: var(--input); border: 1px solid var(--border); border-radius: 6px; padding: 7px 9px; width: 100%; }
  input:focus, select:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  .ao input { border-color: var(--accent); font-weight: 700; }
  .verdict { background: var(--accent-soft); border-color: var(--accent); }
  .verdict strong { color: var(--accent); }
  .tablewrap { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { padding: 6px 8px; text-align: right; border-bottom: 1px solid var(--border); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; vertical-align: bottom; }
  th .lbl { justify-content: flex-end; }
  th:first-child .lbl { justify-content: flex-start; }
  th:first-child, td:first-child { text-align: left; }
  td input { width: 84px; padding: 4px 6px; text-align: right; }
  tbody.products > tr { cursor: pointer; }
  tbody.products > tr:hover td { background: var(--accent-soft); }
  tr.top td { font-weight: 700; }
  tr.open td { border-bottom-color: transparent; }
  tr.detail { cursor: default !important; }
  tr.detail > td { background: var(--bg) !important; padding: 12px; white-space: normal; }
  tr.detail table { background: var(--panel); border: 1px solid var(--border); border-radius: 8px; }
  tr.best td { background: var(--accent-soft); font-weight: 700; }
  .pos { color: var(--good); } .neg { color: var(--bad); } .dim { color: var(--muted); }
  .note { font-size: 12px; color: var(--muted); margin-top: 10px; }
  .chev { display: inline-block; width: 1em; color: var(--muted); }
  .itemopts { display: flex; gap: 12px; flex-wrap: wrap; margin-bottom: 10px; }
  .itemopts label { width: 170px; }
  .toolbar { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-bottom: 10px; }
  .refreshstatus { font-size: 13px; }
  #refresh .note { margin: 0; white-space: pre-line; }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .sorthint { font-size: 12px; margin-left: auto; }
  button { font: inherit; font-size: 13px; font-weight: 600; color: var(--text); background: var(--input); border: 1px solid var(--border);
    border-radius: 6px; padding: 6px 12px; cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--panel); }
  th.sortable { cursor: pointer; user-select: none; }
  th.sortable:hover { color: var(--text); }
  th.sorted { color: var(--accent); }
  .arrow { font-size: 10px; min-width: 8px; }
  tr.sub td:first-child { padding-left: 26px; }

  /* "?" help: hover or focus (tap on phones) shows the explanation. */
  .help { position: relative; display: inline-flex; align-items: center; justify-content: center; width: 15px; height: 15px; border-radius: 50%;
    border: 1px solid var(--muted); color: var(--muted); font-size: 10px; font-weight: 700; cursor: help; flex: none; text-transform: none; }
  .help:focus { outline: 2px solid var(--accent); outline-offset: 1px; }
  .help .tip { display: none; position: absolute; z-index: 10; top: calc(100% + 6px); left: 50%; transform: translateX(-50%);
    width: 260px; padding: 8px 10px; border-radius: 6px; background: var(--tip-bg); color: var(--tip-text);
    font-size: 12px; font-weight: 400; line-height: 1.4; text-align: left; white-space: normal; box-shadow: 0 4px 16px rgba(0,0,0,.25); }
  .help:hover .tip, .help:focus .tip { display: block; }
  th:last-child .help .tip, th:nth-last-child(2) .help .tip { left: auto; right: -6px; transform: none; }
  th:first-child .help .tip { left: -6px; transform: none; }
</style>
<script src="retail-prices.js"></script>
</head>
<body>
<main>
  <h1>Retail profit calculator</h1>
  <p class="sub">Pick your building and enter your admin overhead. Every product the building sells is ranked by profit per hour. Click a product to see every quality. Uses the in-game Sales Calculator's formula. <span id="asof"></span></p>

  <section class="panel">
    <div class="grid" id="settings"></div>
  </section>

  <section class="panel" id="refresh">
    <div class="toolbar">
      <button id="rall" type="button">Refresh all prices (1 request)</button>
      <button id="rbuilding" type="button">Exact quality prices for this building</button>
      <button id="rclear" type="button">Cancel queue</button>
      <span id="refreshhelp"></span>
      <span class="dim refreshstatus" id="rstatus"></span>
    </div>
    <p class="note" id="rlog"></p>
  </section>

  <section class="panel verdict" id="verdict"></section>

  <section class="panel">
    <div class="toolbar">
      <button id="expand" type="button" aria-pressed="false">Show all qualities</button> <span id="expandhelp"></span>
      <span class="dim sorthint">Click any column header to sort by it; click again to flip the order.</span>
    </div>
    <div class="tablewrap">
      <table>
        <thead><tr id="phead"></tr></thead>
        <tbody class="products" id="products"></tbody>
      </table>
    </div>
    <p class="note" id="foot"></p>
  </section>
</main>

const ZFR = 370, QFR = { B: 2.28 };

// ---------- the game's retail model (ported from its Sales Calculator) ----------
function secondsToSell(m, quality, saturation, amount, price, store) {
  const u = Math.min(Math.max(2 - saturation, 0), 2);
  const p = Math.max(0.9, u / 2 + 0.5);
  const f = quality / 12;
  const wages = m.modeledStoreWages ?? 0, cost = m.modeledProductionCostPerUnit;
  const mm = ZFR * (m.buildingLevelsNeededPerUnitPerHour * m.modeledUnitsSoldAnHour + 1) * (QFR[store] ?? 1) * ((u / 2) * (1 + f * DATA.qualityWeight));
  const h = m.modeledUnitsSoldAnHour * p;
  const v = cost + (mm + wages) / h;
  const y = mm - (price - v) ** 2 * ((wages + mm) / ((v - cost) * (v - cost)));
  const s = (amount * ((price - cost) * 3600) - wages) / (y + wages);
  return s > 0 ? s : NaN;
}
function unitsPerHour(m, q, sat, price, speedPct, store) {
  let s = secondsToSell(m, q, sat, 100, price, store);
  s -= (s * speedPct) / 100;
  return (100 * 3600) / s;
}
function profit(ctx, m, sat, q, price, cost) {
  const uph1 = unitsPerHour(m, q, sat, price, ctx.speed, ctx.store);
  if (!(uph1 > 0)) return null;
  const perUnit = price - (ctx.wage * ctx.overhead) / uph1 - cost;
  const uph = uph1 * ctx.level;
  return { perUnit, uph, perHour: perUnit * uph };
}
function bestPrice(ctx, m, sat, avg, q, cost) {
  // Coarse sweep then a 1¢ refinement, so a $20k car doesn't mean millions of iterations.
  const lo = Math.max(0.01, cost), hi = Math.max(cost * 4, avg * 2);
  const step = Math.max(0.01, (hi - lo) / 2000);
  let r = null;
  const scan = (a, b, s) => {
    for (let price = a; price <= b; price += s) {
      const p = profit(ctx, m, sat, q, price, cost);
      if (p && (!r || p.perHour > r.perHour)) r = { ...p, price: Math.round(price * 100) / 100 };
    }
  };
  scan(lo, hi, step);
  if (r && step > 0.01) scan(Math.max(lo, r.price - step), r.price + step, 0.01);
  return r;
}

function costs(it) {
  const o = over[it.id]?.cost ?? {};
  const book = PRICES.books[it.id];
  const tick = PRICES.ticker?.[it.id];
  // The ticker (one request, every product) is the cheapest Q0 offer. When it is newer than the
  // product's full order book, keep the book's quality premiums and rescale them to today's Q0.
  if (tick && book?.cost?.[0] && PRICES.tickerAt && Date.parse(PRICES.tickerAt) > Date.parse(book.at)) {
    const out = {};
    for (let q = 0; q <= 12; q++) {
      const v = o[q] !== undefined ? o[q] : book.cost[q] != null ? Math.round(tick * (book.cost[q] / book.cost[0]) * 100) / 100 : undefined;
      out[q] = v === "" || v == null ? null : +v;
    }
    return { costs: out, source: { kind: "scaled", at: PRICES.tickerAt, bookAt: book.at } };
  }
  const base = book?.cost ?? it.cost ?? {};
  const out = {};
  for (let q = 0; q <= 12; q++) {
    let v = o[q] !== undefined ? o[q] : base[q];
    if (v === undefined && q === 0 && PRICES.ticker[it.id]) v = PRICES.ticker[it.id];
    out[q] = v === "" || v == null ? null : +v;
  }
  const source = book ? { kind: "book", at: book.at } : PRICES.ticker[it.id] ? { kind: "ticker", at: PRICES.tickerAt } : Object.keys(it.cost ?? {}).length ? { kind: "old", at: null } : null;
  return { costs: out, source };
}
function market(it) {
  const r = PRICES.retail[it.id];
  const o = over[it.id] ?? {};
  return {
    avg: o.avg != null && o.avg !== "" ? +o.avg : r?.avg ?? it.avg,
    sat: o.sat != null && o.sat !== "" ? +o.sat : r?.sat ?? it.sat,
  };
}

function evaluate(ctx, it) {

    const cost = c[q];
    const r = cost != null ? bestPrice(ctx, m, sat, avg, q, cost) : null;
    const atAvg = cost != null ? profit(ctx, m, sat, q, avg, cost) : null;
    rows.push({ q, cost, r, atAvg });
    if (r && (!best || r.perHour > best.r.perHour)) best = { q, cost, r };
  }
  return { it, avg, sat, rows, best, source };
}

// ---------- render ----------
function render() {
  const code = $("store").value;
  const ctx = {
    store: code,
    wage: DATA.averageSalary * (DATA.buildings[code]?.salaryModifier ?? 1),
    overhead: 1 + (+$("ao").value || 0) / 100,
    speed: (+$("sales").value || 0) + Math.floor((+$("cmo").value || 0) / 3),
    level: Math.max(1, +$("level").value || 1),
  };
  const results = DATA.items.filter((i) => i.stores.includes(code)).map((it) => evaluate(ctx, it));
  const leader = results.reduce((a, b) => ((b.best?.r.perHour ?? -Infinity) > (a?.best?.r.perHour ?? -Infinity) ? b : a), null);
  const topRes = leader?.best && leader.best.r.perHour > 0 ? leader : null;

  // Flatten to table rows: the best quality per product, or every priced quality when expanded.
  const lines = [];
  for (const res of results) {
    const ageMin = res.source?.at ? (Date.now() - Date.parse(res.source.at)) / 60000 : null;
    const ageText = res.source?.kind === "old" ? "old" : res.source ? ago(res.source.at) + (res.source.kind === "ticker" ? " (Q0 only)" : res.source.kind === "scaled" ? ` (Q1+ est. from ${ago(res.source.bookAt)} book)` : "") : "no price";
    const base = { it: res.it, res, avg: res.avg, sat: res.sat, ageMin, ageText };
    const picked = expanded ? res.rows.filter((x) => x.cost != null) : res.best ? [res.best] : [];
    if (picked.length === 0) lines.push({ ...base, q: null, cost: null, r: null });
    for (const x of picked) lines.push({ ...base, q: x.q, cost: x.cost, r: x.r, isBest: res.best?.q === x.q });
  }
  const col = COLS.find((c) => c.k === sort.k) ?? COLS[6];
  lines.sort((a, b) => {
    const va = col.get(a), vb = col.get(b);
    // Rows with no value always sink to the bottom, whichever way the column is sorted.
    if (va == null || Number.isNaN(va)) return vb == null || Number.isNaN(vb) ? 0 : 1;
    if (vb == null || Number.isNaN(vb)) return -1;
    const c = col.text ? String(va).localeCompare(String(vb)) : va - vb;
    return c * sort.dir || (a.q ?? 0) - (b.q ?? 0);
  });
  renderHead();

  $("products").innerHTML = lines.map((x) => {
    const { it, r: b, q } = x;
    const key = `${it.id}-${q}`;
    const open = openKey === key;
    const isTop = topRes && topRes.it === it && topRes.best.q === q;
    return `<tr data-key="${key}" data-id="${it.id}" class="${isTop ? "top" : ""} ${open ? "open" : ""}">
      <td><span class="chev">${open ? "▾" : "▸"}</span>${it.name}${it.season ? ` <span class="dim">(${it.season})</span>` : ""}${expanded && x.isBest ? ` <span class="dim">★</span>` : ""}</td>
      <td>${q != null ? "Q" + q : "—"}</td>
      <td>${x.cost != null ? money(x.cost) : "—"}</td>
      <td>${b ? money(b.price) : "—"}</td>
      <td>${b ? b.uph.toFixed(1) : "—"}</td>
      <td class="${b ? cls(b.perUnit) : ""}">${b ? money(b.perUnit) : "—"}</td>
      <td class="${b ? cls(b.perHour) : ""}">${b ? money0(b.perHour) : "—"}</td>
      <td class="${b ? cls(b.perHour) : ""}">${b ? money0(b.perHour * 24) : "—"}</td>
      <td>${money(x.avg)}</td>
      <td>${x.sat.toFixed(3)}</td>
      <td class="dim">${x.ageText}</td>
    </tr>${open ? detail(x.res) : ""}`;
  }).join("");
  const top = topRes;

  const name = DATA.buildings[code]?.name ?? code;
  $("verdict").innerHTML = top
    ? `In your <strong>${name}</strong>: sell <strong>${top.it.name} Q${top.best.q}</strong> — buy at ${money(top.best.cost)}, sell at <strong>${money(top.best.r.price)}</strong> → ${money(top.best.r.perUnit)} per unit, ${top.best.r.uph.toFixed(0)} units/h, <strong>${money0(top.best.r.perHour)}/h · ${money0(top.best.r.perHour * 24)}/day</strong> at level ${ctx.level}.`
    : `<strong>Nothing in your ${name} is profitable</strong> at ${$("ao").value}% admin overhead with the buy prices available. Lower overhead, a CMO, or cheaper inputs (your own production) change this — open a product to enter your own cost.`;

  const nBooks = results.filter((r) => r.source?.kind === "book").length;
  $("foot").innerHTML = `Buy prices: ${nBooks} of ${results.length} products in this building have a full exchange order book${PRICES.builtAt ? ` (data file updated ${ago(PRICES.builtAt)} ago — reload the page to pick up newer prices)` : ""}. “Q0 only” = only the cheapest offer is known so far. Products without a price show “—”; open them and type your cost. Store wages: ${money0(ctx.wage)}/h per level before overhead.`;
  persist();
}

function detail({ it, avg, sat, rows, best }) {
  const o = over[it.id] ?? {};
  return `<tr class="detail"><td colspan="11">
    <div class="itemopts">
      <label>${lbl("Avg retail price $", "avg")}<input data-f="avg" data-id="${it.id}" type="number" step="0.01" min="0" value="${o.avg ?? ""}" placeholder="${avg}"></label>
      <label>${lbl("Saturation", "sat")}<input data-f="sat" data-id="${it.id}" type="number" step="0.001" min="0" value="${o.sat ?? ""}" placeholder="${sat}"></label>
    </div>
    <div class="tablewrap"><table>
      <thead><tr>
        <th>${lbl("Quality", "quality")}</th><th>${lbl("Buy price $", "buy")}</th><th>${lbl("Sell at", "sell")}</th><th>${lbl("Units / h", "uph")}</th>
        <th>${lbl("Profit / unit", "ppu")}</th><th>${lbl("Profit / h", "pph")}</th><th>${lbl("Profit / day", "ppd")}</th><th>${lbl("Profit/unit at avg", "atavg")}</th>
      </tr></thead>
      <tbody>${rows.map(({ q, cost, r, atAvg }) => `
        <tr class="${best && best.q === q ? "best" : ""}">
          <td>Q${q}</td>
          <td><input data-f="cost" data-q="${q}" data-id="${it.id}" type="number" step="0.01" min="0" value="${cost ?? ""}" placeholder="—"></td>
          <td>${r ? money(r.price) : "—"}</td>
          <td>${r ? r.uph.toFixed(1) : "—"}</td>
          <td class="${r ? cls(r.perUnit) : ""}">${r ? money(r.perUnit) : "—"}</td>
          <td class="${r ? cls(r.perHour) : ""}">${r ? money0(r.perHour) : "—"}</td>
          <td class="${r ? cls(r.perHour) : ""}">${r ? money0(r.perHour * 24) : "—"}</td>
          <td class="${atAvg ? cls(atAvg.perUnit) : ""}">${atAvg ? money(atAvg.perUnit) : "—"}</td>
        </tr>`).join("")}</tbody>
    </table></div>
    <p class="note">Edits are saved in this browser. Clear a buy price box to go back to the exchange price.</p>
  </td></tr>`;
}

// ---------- events ----------
$("products").addEventListener("click", (e) => {
  if (e.target.closest(".detail") || e.target.closest(".help")) return;
  const tr = e.target.closest("tr[data-key]");
  if (!tr) return;
  openKey = openKey === tr.dataset.key ? null : tr.dataset.key;
  render();
});
$("products").addEventListener("change", (e) => {
  const t = e.target;
  if (!t.dataset.f) return;
  const o = (over[t.dataset.id] ??= {});
  if (t.dataset.f === "cost") {
    o.cost ??= {};
    // An emptied box drops the override so the exchange price shows again.
    if (t.value === "") delete o.cost[t.dataset.q]; else o.cost[t.dataset.q] = t.value;
  } else {
    o[t.dataset.f] = t.value;
  }
  render();
});
$("store").addEventListener("change", () => { openKey = null; render(); });
for (const id of SETTING_IDS.slice(1)) $(id).addEventListener("input", render);
$("asof").textContent = `Retail model data: ${DATA.asOf}.`;
// ---------- refresh (needs the local server: node serve.mjs) ----------
HELP.refresh = "Refresh all prices: ONE request updates the cheapest Q0 price of every product at once. Higher qualities are estimated by keeping each product's last known quality premium (e.g. Q3 was 7% above Q0) — marked \"est.\" in Price age. Exact quality prices: fetches each product's full order book, one request per product, 5 minutes apart (the game's limit), to make those estimates exact again — only needed now and then. Average retail prices refresh automatically once a day. Needs the local server: start.command (Mac) / start.bat (Windows), or node serve.mjs in this folder, then open http://localhost:8765.";
$("refreshhelp").innerHTML = help("refresh");
const served = location.protocol.startsWith("http");
let lastBuilt = PRICES.builtAt;
const NAMES = Object.fromEntries(DATA.items.map((i) => [i.id, i.name]));
const keyName = (k) => (k === "ticker" ? "cheapest prices (all products)" : k === "retail" ? "average retail prices" : NAMES[k.slice(5)] ?? k);
const mmss = (s) => `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
async function api(path, body) {
  const res = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  return res.json();
}
function showStatus(st) {
  const n = st.queue.length;
  if (st.paused) $("rstatus").textContent = `Paused: the game refused a request. Wait a while, then press a refresh button again.`;
  else if (n === 0) $("rstatus").textContent = `Nothing queued. Prices file updated ${ago(st.builtAt)} ago.`;
  else {
    const eta = st.nextRequestInS + (n - 1) * st.gapS;
    $("rstatus").textContent = `${n} queued · next: ${keyName(st.queue[0])} in ${mmss(st.nextRequestInS)} · all done in ~${Math.round(eta / 60)} min`;
  }
  $("rlog").textContent = st.log.slice(0, 3).map((l) => l.replace(/book:(\d+)/, (_, id) => NAMES[id] ?? id)).join("\n");
}
async function poll() {
  try {
    const st = await api("/api/status");
    showStatus(st);
    if (st.builtAt && st.builtAt !== lastBuilt) {
      PRICES = await api("/api/prices");
      lastBuilt = st.builtAt;
      render();
    }
  } catch { $("rstatus").textContent = "Lost the local server — is serve.mjs still running?"; }
}
async function queue(keys, front) {
  try { showStatus(await api("/api/refresh", { keys, front })); } catch { $("rstatus").textContent = "Couldn't reach the local server."; }
}
if (served) {
  $("rbuilding").addEventListener("click", () => {
    const code = $("store").value;
    queue(DATA.items.filter((i) => i.stores.includes(code)).map((i) => `book:${i.id}`), true);
  });
  // Averages are daily figures, so they ride along only when a day old.
  $("rall").addEventListener("click", () => {
    const retailStale = !PRICES.retailAt || Date.now() - Date.parse(PRICES.retailAt) > 20 * 3600e3;
    queue(retailStale ? ["ticker", "retail"] : ["ticker"], true);
  });
  $("rclear").addEventListener("click", async () => showStatus(await api("/api/clear", {})));
  poll();
  setInterval(poll, 5000);
} else {
  for (const id of ["rbuilding", "rall", "rclear"]) $(id).disabled = true;
  $("rstatus").textContent = "To refresh prices, double-click start.command (Mac) or start.bat (Windows) in this folder — see README.txt";
}

render();
</script>
</body>
</html>
